<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Sheet</title>
<style>
  :root { --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; color: var(--text); background: #fff; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); margin: 0 auto; padding: 32px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, sans-serif; }
  .sub { margin: 4px 0 16px; color: var(--mute); }
  .stage { position: relative; padding: 24px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .row button { font: inherit; padding: 4px 10px; }
  .phone { position: relative; width: 360px; height: 560px; overflow: hidden; border: 1px solid #ccc; border-radius: 18px; background: linear-gradient(#dcebf7, #f6f3ea); } sakuga-sheet { position: absolute; left: 0; right: 0; bottom: 0; flex-direction: column; height: var(--sheet-size, 56px); } sakuga-sheet[snap=half] { --sheet-size: 50%; } sakuga-sheet[snap=full] { --sheet-size: 100%; } .bar { display: flex; justify-content: space-around; height: 56px; align-items: center; font-weight: 700; } .body { padding: 8px 14px; border-top: 1.5px solid #b8b3ff; }
</style>
</head>
<body>
<main>
  <h1>Sheet</h1>
  <p class="sub">The phone’s panel: the page keeps its tabs and drag; the sheet springs to each snap. Made for my-home (#168 §5, HUD v2 #200), not from upstream.</p>
  <div class="row"><button id="c">Collapsed</button><button id="h">Half</button><button id="fl">Full</button></div>
  <div class="stage"><div class="phone"><sakuga-sheet id="s" snap="collapsed"><div class="bar"><span>View</span><span>Furniture</span><span>Photos</span></div><div class="body">The open panel’s content.</div></sakuga-sheet></div></div>
</main>
<script src="sheet.js"></script>
<script>
const s = document.getElementById('s');
for (const [id, snap] of [['c', 'collapsed'], ['h', 'half'], ['fl', 'full']]) document.getElementById(id).onclick = () => s.setAttribute('snap', snap);
</script>
</body>
</html>
