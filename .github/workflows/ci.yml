name: CI

# Every green build of main deploys to production (home.nntin.xyz); every green same-repo pull request push,
# v* tag and manual dispatch deploys to the single shared staging environment (home-staging.nntin.xyz), where
# the latest deploy wins. CI publishes images and a Helm chart (0.1.0-main.<run> / 0.1.0-staging.<run>) with the
# image digests stamped in; Flux in NNTin/lair.nntin.xyz follows each channel. See docs/deployment.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Deploys the selected branch or tag to staging, e.g. main to reset staging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on the runner; the skill tests are offline (gh is stubbed).
      - run: shellcheck -x -P SCRIPTDIR .claude/skills/*/scripts/*.sh .claude/skills/*/tests/*.sh
      - run: for t in .claude/skills/*/tests/*.test.sh; do "$t"; done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: myhome
          POSTGRES_PASSWORD: myhome
          POSTGRES_DB: myhome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myhome -d myhome"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://myhome:myhome@localhost:5432/myhome
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @my-home/api test

  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ghcr.io/nntin/my-home-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ghcr.io/nntin/my-home-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -euo pipefail
          health=$(curl -fsS --retry 5 --retry-connrefused http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | jq -e '.status == "ok" and .db.status == "ok" and .db.driver == "postgres"'
          curl -fsS http://localhost:8080/api/homes | jq -e '.items | map(.id) | index("mock-home") != null'
          curl -fsS http://localhost:8080/api/homes/mock-home \
            | jq -e '.schemaVersion == 1 and (.levels | length) == 3 and (.apartments | length) == 3
                and .building.roof.type == "gable" and (.outdoorAreas | length) == 3'
          curl -fsS http://localhost:8080/api/homes/mock-home/export | jq -e '.id == "mock-home"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # The web app manifest and its icons (installable app).
          curl -fsS -D manifest.headers -o manifest.json http://localhost:8080/manifest.webmanifest
          grep -qi '^content-type: application/manifest+json' manifest.headers
          jq -e '.display == "standalone" and .start_url == "/"' manifest.json
          for icon in $(jq -r '.icons[].src' manifest.json) /icons/apple-touch-icon.png; do
            curl -fsS -o /dev/null "http://localhost:8080$icon"
          done
          curl -fsS http://localhost:8080/api/health/live | jq -e '.status == "ok"'
      - name: Smoke test layouts
        run: |
          set -euo pipefail
          base=http://localhost:8080/api
          bed='{"id":"bed-1","typeId":"bed","levelId":"souterrain","roomId":"souterrain-bedroom","position":{"x":-3,"z":2.5},"rotationY":0,"props":{}}'
          layout=$(curl -fsS -X POST "$base/homes/mock-home/layouts" -H 'content-type: application/json' \
            --data "{\"name\":\"Smoke test\",\"items\":[$bed]}")
          echo "$layout" | jq -e '.version == 1 and (.items | length) == 1'
          id=$(echo "$layout" | jq -er '.id')
          curl -fsS "$base/homes/mock-home/layouts" \
            | jq -e --arg id "$id" 'any(.items[]; .id == $id and .itemCount == 1)'
          # Optimistic concurrency: the first update wins, a second one with the same version is a 409.
          update='{"name":"Smoke test","items":[],"version":1}'
          curl -fsS -X PUT "$base/layouts/$id" -H 'content-type: application/json' --data "$update" \
            | jq -e '.version == 2 and (.items | length) == 0'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$base/layouts/$id" \
            -H 'content-type: application/json' --data "$update")
          test "$status" = 409
          # Export, import as a new layout, clean up.
          curl -fsS "$base/layouts/$id/export" -o layout.json
          jq -e '.name == "Smoke test" and .schemaVersion == 1' layout.json
          copy=$(curl -fsS -X POST "$base/homes/mock-home/layouts/import" \
            -H 'content-type: application/json' --data @layout.json | jq -er '.id')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$base/layouts/$copy")" = 204
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$base/layouts/$id")" = 204
      - name: Smoke test photos
        run: |
          set -euo pipefail
          base=http://localhost:8080/api
          # A 1200x900 PNG of noise, about 3 MB: bigger than nginx's default body limit, like a phone photo.
          python3 - <<'PY'
          import os, struct, zlib
          w, h = 1200, 900
          raw = b''.join(b'\0' + os.urandom(w * 3) for _ in range(h))
          chunk = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d))
          open('photo.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(raw, 1)) + chunk(b'IEND', b''))
          PY
          test "$(stat -c %s photo.png)" -gt 2000000
          request=$(curl -fsS -X POST "$base/homes/mock-home/photo-requests" -H 'content-type: application/json' \
            --data '{"roomId":"souterrain-kitchen","reason":"Smoke test","requester":"agent"}' | jq -er '.id')
          meta="{\"levelId\":\"souterrain\",\"pose\":{\"position\":{\"x\":3,\"y\":-1,\"z\":-2},\"yaw\":0.5,\"pitch\":0},\"tags\":[\"smoke\"],\"requestId\":\"$request\"}"
          photo=$(curl -fsS -X POST "$base/homes/mock-home/photos" -F "meta=$meta" -F 'image=@photo.png')
          echo "$photo" | jq -e '.capturedRoomId == "souterrain-kitchen" and .image.width == 1200
            and .image.contentType == "image/webp" and .thumbnail.width == 480 and .deletedAt == null'
          id=$(echo "$photo" | jq -er '.id')
          curl -fsS "$base/homes/mock-home/photos?roomId=souterrain-kitchen&tag=smoke" \
            | jq -e --arg id "$id" '.total == 1 and .items[0].id == $id'
          curl -fsS "$base/photo-requests/$request" | jq -e --arg id "$id" '.status == "fulfilled" and .photoIds == [$id]'
          test "$(curl -fsS -o photo.webp -w '%{content_type}' "$base/photos/$id/image")" = image/webp
          sum=$(sha256sum < photo.webp)
          # A stored photo uploaded again (the copy tool) is accepted and re-encoded like any upload.
          copy=$(curl -fsS -X POST "$base/homes/mock-home/photos" \
            -F 'meta={"pose":{"position":{"x":0,"y":0,"z":0},"yaw":0,"pitch":0}}' -F 'image=@photo.webp' \
            | jq -er 'select(.image.width == 1200 and .image.contentType == "image/webp") | .id')
          curl -fsS -X DELETE "$base/photos/$copy" > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/photos/$copy/purge")" = 204
          # Not an image: 415. Soft delete, trash, restore.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/homes/mock-home/photos" \
            -F "meta=$meta" -F 'image=@docker-compose.yml')" = 415
          curl -fsS -X DELETE "$base/photos/$id" | jq -e '.deletedAt != null and .purgeAt != null'
          curl -fsS "$base/homes/mock-home/photos" | jq -e '.total == 0'
          curl -fsS "$base/homes/mock-home/trash" | jq -e --arg id "$id" '.photos | map(.id) == [$id]'
          curl -fsS -X POST "$base/photos/$id/restore" | jq -e '.deletedAt == null'
          # A staging deploy: reset the database, migrate and seed. Homes are replaced, photos stay.
          curl -fsS -X POST "$base/homes/mock-home/layouts" -H 'content-type: application/json' \
            --data '{"name":"Dropped by the reset","items":[]}' | jq -e '.version == 1'
          docker compose run --rm --no-deps -e ALLOW_DATABASE_RESET=true api node dist/reset.js
          curl -fsS "$base/homes/mock-home/layouts" | jq -e '.items == []'
          curl -fsS "$base/photos/$id" | jq -e '.capturedRoomStatus == "current" and .room.id == "souterrain-kitchen"'
          curl -fsS "$base/photo-requests/$request" | jq -e '.status == "fulfilled"'
          test "$(curl -fsS "$base/photos/$id/image" | sha256sum)" = "$sum"
          # A restart migrates again: still there.
          docker compose restart api
          docker compose up -d --no-build --wait --wait-timeout 120
          test "$(curl -fsS --retry 5 --retry-connrefused "$base/photos/$id/image" | sha256sum)" = "$sum"
      - name: Smoke test uses
        run: |
          set -euo pipefail
          base=http://localhost:8080/api
          home=$base/homes/mock-home
          agent=(-H 'X-My-Home-Actor: agent' -H 'content-type: application/json')
          # nginx passes the identity header on; the api maps the agent's username.
          curl -fsS "$base/whoami" -H 'X-Authentik-Username: nntin-bot' \
            | jq -e '. == {"username":"nntin-bot","actor":"agent","actorSource":"identity"}'
          curl -fsS "$base/whoami" "${agent[@]}" | jq -e '.actor == "agent" and .actorSource == "declared"'
          curl -fsS "$base/catalog/types" | jq -e 'any(.items[]; .id == "furniture.bed")'
          bed=$(curl -fsS -X POST "$home/placements" "${agent[@]}" \
            --data '{"typeId":"furniture.bed","levelId":"souterrain","position":{"x":-3,"z":2.5},"rotationY":0}')
          echo "$bed" | jq -e '.roomId == "souterrain-bedroom" and .version == 1'
          id=$(echo "$bed" | jq -er '.id')
          curl -fsS -X PATCH "$home/placements/$id" "${agent[@]}" --data '{"version":1,"params":{"width":1.8}}' \
            | jq -e '.params.width == 1.8 and .version == 2'
          history=$(curl -fsS "$home/uses/$id/history")
          echo "$history" | jq -e '.items | length == 2 and all(.[]; .actor == "agent")
            and .[0].changes[0].text == "width 160.0 cm → 180.0 cm"'
          entry=$(echo "$history" | jq -er '.items[0].id')
          curl -fsS -X POST "$home/uses/$id/history/$entry/undo" "${agent[@]}" \
            | jq -e '.entry.action == "undo" and .use.overrides == {}'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$home/uses/$id/history/$entry/undo")" = 409
          curl -fsS "$base/catalog/usage" | jq -e '.counts["furniture.bed"] >= 1'
          # A staging deploy (reset, migrate, seed) keeps the placement and its history.
          docker compose run --rm --no-deps -e ALLOW_DATABASE_RESET=true api node dist/reset.js
          curl -fsS "$home/placements" | jq -e --arg id "$id" 'any(.items[]; .id == $id)'
          curl -fsS "$home/uses/$id/history" | jq -e '.items | length == 3'
          curl -fsS -X DELETE "$home/placements/$id?version=3" "${agent[@]}" | jq -e '.removedAt != null'
          curl -fsS "$home/placements" | jq -e '.items == []'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - run: bash tools/check-chart.sh

  publish:
    # Fork pull requests are validated only: no secrets, no images, no deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, test-postgres, docker, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.ref.outputs.revision }}
      channel: ${{ steps.ref.outputs.channel }}
      api-digest: ${{ steps.api.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve revision, channel and tags
        id: ref
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          short=${revision:0:7}
          channel=staging
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && channel=main
          # main: :main :sha-<short>; PR: :pr-<n> :sha-<short>; v* tag: :vX.Y.Z (+ :latest on main); dispatch: :sha-<short>.
          tags=(sha-$short)
          if [ -n "$PR" ]; then
            tags+=(pr-$PR)
          elif [ "$channel" = main ]; then
            tags+=(main)
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=("${GITHUB_REF#refs/tags/}")
            git merge-base --is-ancestor "$revision" origin/main && tags+=(latest)
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
          echo "Publishing $revision to $channel as: ${tags[*]}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          TAGS: ${{ steps.ref.outputs.tags }}
        run: |
          for app in api web; do
            echo "$app<<EOF" >> "$GITHUB_OUTPUT"
            for tag in $TAGS; do echo "ghcr.io/nntin/my-home-$app:$tag" >> "$GITHUB_OUTPUT"; done
            echo "EOF" >> "$GITHUB_OUTPUT"
          done
      - name: Publish api image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          # source links the package to this repository, so the workflow token can manage its versions.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.revision }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Publish web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          # source links the package to this repository, so the workflow token can manage its versions.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.revision }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    # One deploy per environment at a time. A newer pending deploy replaces an older pending one, and the chart
    # is only published here, so the latest deploy wins and two deploys never race. GitHub records each run as a
    # deployment of the environment and marks the previous one inactive, which the pull request shows.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ needs.publish.outputs.channel == 'main' && 'production' || 'staging' }}
      url: ${{ needs.publish.outputs.channel == 'main' && 'https://home.nntin.xyz' || 'https://home-staging.nntin.xyz' }}
    concurrency:
      group: deploy-${{ needs.publish.outputs.channel }}
      cancel-in-progress: false
    env:
      REVISION: ${{ needs.publish.outputs.revision }}
      CHANNEL: ${{ needs.publish.outputs.channel }}
      HOST: ${{ needs.publish.outputs.channel == 'main' && 'home.nntin.xyz' || 'home-staging.nntin.xyz' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.revision }}
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - name: Publish chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web-digest }}
        run: |
          set -euo pipefail
          version="0.1.0-$CHANNEL.$GITHUB_RUN_NUMBER"
          python3 tools/stamp-chart-digests.py "$API_DIGEST" "$WEB_DIGEST"
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/my-home --version "$version" --app-version "$REVISION" --destination release
          helm push "release/my-home-$version.tgz" oci://ghcr.io/nntin/charts
          echo "### Published my-home $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$REVISION\` → $CHANNEL (https://$HOST)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the environment runs this commit
        # Flux polls the chart channel every 2 minutes; the pre-deploy hook migrates (staging: resets) first.
        run: |
          set -uo pipefail
          for attempt in $(seq 1 90); do
            commit=$(curl -fsS --max-time 10 -A 'Mozilla/5.0 (my-home CI)' "https://$HOST/api/health/live" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$REVISION" ]; then
              echo "https://$HOST runs $REVISION"
              exit 0
            fi
            echo "attempt $attempt: https://$HOST runs ${commit:-unknown}, waiting for $REVISION"
            sleep 10
          done
          echo "::error::https://$HOST did not switch to $REVISION within 15 minutes"
          exit 1
