# CI stamps both digests (tools/stamp-chart-digests.py) before packaging; an empty digest does not render.
images:
  api:
    repository: ghcr.io/nntin/my-home-api
    digest: ''
  web:
    repository: ghcr.io/nntin/my-home-web
    digest: ''
imagePullSecrets: []
database:
  # Secret holding DATABASE_URL for this environment's database. The infrastructure repository provisions it.
  secretName: my-home-db
  # Staging only: every deploy also drops `public` (homes, layouts) before migrating. `media` and `userdata` stay.
  resetOnDeploy: false
homes:
  # data/homes files the release job syncs on every deploy (docs/deployment.md). Empty: [home.json] on production,
  # [home.json, mock-home.json] when database.resetOnDeploy (staging).
  files: []
release:
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
rollout:
  progressDeadlineSeconds: 1800
api:
  replicas: 1
  logLevel: info
  # SSO usernames (comma-separated) recorded as `agent` in the history (docs/userdata.md).
  agentUsernames: nntin-bot
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    # Head-room for decoding and re-encoding one full-size phone photo at a time (docs/photos.md).
    limits: { cpu: 500m, memory: 512Mi }
web:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }
