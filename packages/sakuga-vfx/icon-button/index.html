<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Icon Button</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; min-height: 140px; padding: 30px 0; }
  .stage.compact { gap: 12px; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Icon Button</h1>
  <p class="sub">A square paper button with an ink-line icon, for rows of tools. Made for my-home, not from upstream.</p>
  <div class="stage">
  <sakuga-icon-button id="l" label="Rotate left" icon="rotate-left" dir="ccw"></sakuga-icon-button>
  <sakuga-icon-button id="r" label="Rotate right" icon="rotate-right" dir="cw"></sakuga-icon-button>
  <sakuga-icon-button id="u" label="Raise" icon="up" dir="up"></sakuga-icon-button>
  <sakuga-icon-button id="d" label="Lower" icon="down" dir="down"></sakuga-icon-button>
  <sakuga-icon-button id="p" label="Duplicate" icon="duplicate"></sakuga-icon-button>
  <sakuga-icon-button id="x" label="Delete" icon="delete" hit="puff"></sakuga-icon-button>
  <sakuga-icon-button id="t" label="Photos on the map" icon="photos"></sakuga-icon-button>
  </div>
  <div class="stage compact">
  <sakuga-icon-button size="compact" id="cl" label="Rotate left" icon="rotate-left" dir="ccw"></sakuga-icon-button>
  <sakuga-icon-button size="compact" id="cu" label="Raise" icon="up" dir="up"></sakuga-icon-button>
  <sakuga-icon-button size="compact" id="cp" label="Duplicate" icon="duplicate"></sakuga-icon-button>
  <sakuga-icon-button size="compact" id="cx" label="Delete" icon="delete" hit="puff"></sakuga-icon-button>
  <sakuga-icon-button size="compact" id="cc" label="Catalogue" icon="catalogue" href="#top"></sakuga-icon-button>
  <sakuga-icon-button size="compact" id="cd" label="More" icon="more" disabled></sakuga-icon-button>
  </div>
  <p class="hint">Press one. Wedges fly off the corner, or the way it points (<code>dir</code>); a turn draws a crescent; Delete leaves a puff (<code>hit="puff"</code>). The last of the first row is a toggle (<code>pressed</code>).</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="icon-button.js"></script>
<script src="../icons/icons.js"></script>
<script>
// This page's own wiring. The component is all in icon-button.js (named icons from icons/icons.js).
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
for (const b of document.querySelectorAll('sakuga-icon-button')) b.addEventListener('click', () => say(`click: ${b.getAttribute('label')}`));
const t = document.getElementById('t');
t.addEventListener('click', () => { t.pressed = !t.pressed; });
</script>
</body>
</html>
