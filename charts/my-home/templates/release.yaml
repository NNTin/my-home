# Runs before any new pod receives traffic on every environment: validate data/homes, (staging) reset `public`, migrate,
# then sync the homes from git (dist/release.js, docs/deployment.md). A failure aborts the upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-release
  labels:
    {{- include "my-home.labels" . | nindent 4 }}
    app.kubernetes.io/component: release
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.release.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "my-home.selector" (dict "root" . "component" "release") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: release
          image: {{ include "my-home.image" (dict "root" . "role" "api") }}
          command: [node, dist/release.js]
          securityContext: {{ include "my-home.security" . | nindent 12 }}
          resources: {{ toYaml .Values.release.resources | nindent 12 }}
          env:
            {{- include "my-home.apiEnv" . | nindent 12 }}
            {{- $defaultFiles := ternary (list "home.json" "mock-home.json") (list "home.json") .Values.database.resetOnDeploy }}
            - name: HOME_FILES
              value: {{ join "," ((.Values.homes).files | default $defaultFiles) | quote }}
            {{- if .Values.database.resetOnDeploy }}
            - name: ALLOW_DATABASE_RESET
              value: "true"
            - name: RESET_PUBLIC
              value: "true"
            {{- end }}
